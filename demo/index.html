<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMC-7 OCR Parser | Demo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>CMC-7 <span class="accent">Scanner</span></h1>
            <p>Leitura de cheques via câmera em tempo real</p>
        </header>

        <main>
            <div class="scanner-container">
                <div id="camera-viewport" data-testid="camera-viewport">
                    <!-- Scanner Mask Overlay -->
                    <div class="scanner-mask">
                        <div class="guide-box">
                            <div class="corner top-left"></div>
                            <div class="corner top-right"></div>
                            <div class="corner bottom-left"></div>
                            <div class="corner bottom-right"></div>
                            <div class="scan-line"></div>
                        </div>
                    </div>
                </div>
                
                <div class="status-bar">
                    <div class="status-item">
                        <span class="label">Qualidade:</span>
                        <div class="quality-meter">
                            <div id="quality-bar" style="width: 0%"></div>
                        </div>
                        <span id="quality-val" data-testid="quality-val">0%</span>
                    </div>
                    <div id="status-text" data-testid="status-text">Aguardando câmera...</div>
                </div>
            </div>

            <aside class="results-panel">
                <h2>Campos Extraídos</h2>
                <div class="fields-grid" id="results-view" data-testid="results-view">
                    <div class="empty-state">Aponte para a linha CMC-7 do cheque</div>
                </div>
                
                <div class="raw-data">
                    <label>String Bruta (CMC-7):</label>
                    <code id="raw-string" data-testid="raw-string">⑆...⑆...⑇...⑈...⑉...⑊</code>
                </div>
            </aside>
        </main>

        <footer>
            <button id="start-btn" class="primary-btn" data-testid="start-btn">Iniciar Câmera</button>
            <button id="stop-btn" class="secondary-btn" data-testid="stop-btn" disabled>Parar</button>
        </footer>
    </div>
    <script type="module" src="main.ts"></script>
</body>
</html>
